<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="index.css" />
    <title>Etch a Sketch</title>
  </head>
  <body>
    <main id="web-container">
      <div id="intro">
        <div class="intro-header">
            <h1>Etch a Sketch</h1>
            <p>by <a href="https://www.theodinproject.com/" rel="noopener noreferrer">The Odin Project</a></p>
        </div>
        <div class="resolution-options">
            <h3>Choice a canvas size in pixels.</h3>
            <div class="resolutions">
                <button id="8" class="btnRes">8x8</button>
                <button id="16" class="btnRes">16x16</button>
                <button id="32" class="btnRes">32x32</button>
                <button id="64" class="btnRes">64x64</button>
            </div>
            <hr>
        </div>
      </div>
      <div id="sketch">
        <div id="canvas"></div>
      </div>
    </main>
    <script src="app.js"></script>
  </body>
</html>
